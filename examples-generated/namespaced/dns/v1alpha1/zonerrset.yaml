apiVersion: dns.hetzner.m.crossplane.io/v1alpha1
kind: ZoneRRSet
metadata:
  annotations:
    meta.upbound.io/example-id: dns/v1alpha1/zonerrset
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    changeProtection: false
    labels:
      key: value
    name: www
    records:
    - comment: web server 1
      value: 201.78.10.45
    ttl: 10800
    type: A
    zoneSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: dns.hetzner.m.crossplane.io/v1alpha1
kind: Zone
metadata:
  annotations:
    meta.upbound.io/example-id: dns/v1alpha1/zonerrset
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    mode: primary
    name: example.com
