# Phase 2 of 2 for a private-backend Hetzner web stack.
#
# Apply after:
#   kubectl apply -f examples/namespaced/loadbalancer/v1alpha1/web-stack-foundation.yaml
#
# Wait until these foundation resources are ready before applying this file:
# - Subnet/web-stack-subnet
# - Server/edge-gateway
# - Route/internet-egress
# - Route/office-route
# - LoadBalancer/web-entrypoint
#
# The backend servers in this phase are private-only:
# - public IPv4 and IPv6 are disabled
# - each server gets its first NIC at creation time via spec.forProvider.network
# - outbound internet access comes from the gateway node and the default route
apiVersion: server.hetzner.m.crossplane.io/v1alpha1
kind: Server
metadata:
  annotations:
    meta.upbound.io/example-id: loadbalancer/v1alpha1/web-stack
  labels:
    testing.upbound.io/example-name: web-a
  name: web-a
  namespace: crossplane-system
spec:
  forProvider:
    image: ubuntu-24.04
    labels:
      environment: production
      role: web
      stack: web
    location: nbg1
    name: web-a
    network:
    - ip: 10.42.1.11
      networkIdRef:
        name: web-stack-network
    placementGroupIdRef:
      name: web-spread
    publicNet:
    - ipv4Enabled: false
      ipv6Enabled: false
    serverType: cx23
    userData: |
      #cloud-config
      package_update: true
      packages:
      - nginx
      write_files:
      - path: /var/www/html/index.html
        permissions: "0644"
        content: |
          web-a
      - path: /var/www/html/healthz
        permissions: "0644"
        content: ok
      runcmd:
      - systemctl enable nginx
      - systemctl restart nginx

---

