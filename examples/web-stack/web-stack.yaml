---

apiVersion: server.hetzner.m.crossplane.io/v1alpha1
kind: Volume
metadata:
  annotations:
    meta.upbound.io/example-id: loadbalancer/v1alpha1/web-stack
  labels:
    testing.upbound.io/example-name: db-data
  name: db-data
  namespace: crossplane-system
spec:
  forProvider:
    format: ext4
    labels:
      environment: production
      role: db
      stack: web
    location: nbg1
    name: db-data
    size: 80

---

apiVersion: loadbalancer.hetzner.m.crossplane.io/v1alpha1
kind: LoadBalancerTarget
metadata:
  annotations:
    meta.upbound.io/example-id: loadbalancer/v1alpha1/web-stack
  labels:
    testing.upbound.io/example-name: web-a-target
  name: web-a-target
  namespace: crossplane-system
spec:
  forProvider:
    loadBalancerIdRef:
      name: web-entrypoint
    serverIdRef:
      name: web-a
    type: server
    usePrivateIp: true

---

apiVersion: loadbalancer.hetzner.m.crossplane.io/v1alpha1
kind: LoadBalancerTarget
metadata:
  annotations:
    meta.upbound.io/example-id: loadbalancer/v1alpha1/web-stack
  labels:
    testing.upbound.io/example-name: web-b-target
  name: web-b-target
  namespace: crossplane-system
spec:
  forProvider:
    loadBalancerIdRef:
      name: web-entrypoint
    serverIdRef:
      name: web-b
    type: server
    usePrivateIp: true

---

apiVersion: server.hetzner.m.crossplane.io/v1alpha1
kind: VolumeAttachment
metadata:
  annotations:
    meta.upbound.io/example-id: loadbalancer/v1alpha1/web-stack
  labels:
    testing.upbound.io/example-name: db-data-attachment
  name: db-data-attachment
  namespace: crossplane-system
spec:
  forProvider:
    automount: true
    serverIdRef:
      name: db-1
    volumeIdRef:
      name: db-data

---

apiVersion: loadbalancer.hetzner.m.crossplane.io/v1alpha1
kind: LoadBalancerService
metadata:
  annotations:
    meta.upbound.io/example-id: loadbalancer/v1alpha1/web-stack
  labels:
    testing.upbound.io/example-name: web-http
  name: web-http
  namespace: crossplane-system
spec:
  forProvider:
    destinationPort: 80
    healthCheck:
    - http:
      - path: /healthz
        statusCodes:
        - "200"
        tls: false
      interval: 15
      port: 80
      protocol: http
      retries: 3
      timeout: 10
    listenPort: 80
    loadBalancerIdRef:
      name: web-entrypoint
    protocol: http
