apiVersion: server.hetzner.m.crossplane.io/v1alpha1
kind: FirewallAttachment
metadata:
  annotations:
    meta.upbound.io/example-id: server/v1alpha1/firewallattachment
  labels:
    testing.upbound.io/example-name: fw-ref
  name: fw-ref
  namespace: crossplane-system
spec:
  forProvider:
    firewallIdRef:
      name: basic-firewall
    serverIdsRefs:
    - name: test-server

---

apiVersion: network.hetzner.m.crossplane.io/v1alpha1
kind: Firewall
metadata:
  annotations:
    meta.upbound.io/example-id: server/v1alpha1/firewallattachment
  labels:
    testing.upbound.io/example-name: basic-firewall
  name: basic-firewall
  namespace: crossplane-system
spec:
  forProvider:
    name: basic-firewall

---

apiVersion: server.hetzner.m.crossplane.io/v1alpha1
kind: Server
metadata:
  annotations:
    meta.upbound.io/example-id: server/v1alpha1/firewallattachment
  labels:
    testing.upbound.io/example-name: test-server
  name: test-server
  namespace: crossplane-system
spec:
  forProvider:
    image: ubuntu-24.04
    name: test-server
    serverType: cx23
